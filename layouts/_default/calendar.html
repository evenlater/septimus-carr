{{ define "main" }}
{{ partial "event-feed.html" (dict "Site" .Site "ID" "calendar-data") }}

<div class="cal-header">
  <h1 class="cal-title">Calendar</h1>
  <p class="cal-intro">Essay publication dates, reading windows, and the historical moments behind the books.</p>
</div>

<div class="cal-legend">
  <span><span class="cal-dot"></span>Essay published <span class="cal-legend-note">(colored by category)</span></span>
  <span><span class="cal-dot cal-dot-reading"></span>Reading window</span>
  <span><span class="cal-dot cal-dot-historical"></span>Historical event</span>
</div>

<div class="cal-controls">
  <div class="cal-nav">
    <button id="calPrev" class="cal-arrow" aria-label="Previous">&larr;</button>
    <span id="calPeriodLabel" class="cal-period"></span>
    <button id="calNext" class="cal-arrow" aria-label="Next">&rarr;</button>
  </div>
  <div class="cal-jump">
    <label for="calMonthSelect">Jump to</label>
    <select id="calMonthSelect"></select>
    <input type="number" id="calYearInput" placeholder="1816" />
    <button id="calYearGo" class="cal-go">Go</button>
    <button id="calToday" class="cal-go">Today</button>
  </div>
</div>

<div id="calRoot" class="cal-root"></div>

<script src="{{ "js/calendar.js" | relURL }}"></script>
{{ end }}
