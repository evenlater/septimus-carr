<header class="sc-head">
  <a href="{{ "/" | relURL }}" class="logo-wrap">
    <img src="{{ "img/logo.png" | relURL }}" class="logo-img" alt="{{ .Site.Title }}">
    <span class="logo-tag">{{ .Site.Params.tagline }}</span>
  </a>
  <nav class="sc-nav">
    <a href="{{ "/about/" | relURL }}">About</a>
    <a href="{{ "/posts/" | relURL }}">Archive</a>
    <a href="{{ "/calendar/" | relURL }}">Calendar</a>
    <a href="{{ .Site.Params.substack }}" target="_blank" rel="noopener" class="nav-sub">Subscribe</a>
  </nav>
</header>
