<div style="background:var(--surface-1);border-radius:12px;padding:1.25rem;">
<h2 class="sr-only">Prototype of a five-week desktop calendar for septimuscarr.com, with a toggle to preview an Outlook-style mobile week view</h2>
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
  <div style="display:flex;gap:8px;align-items:center;">
    <button id="prevBtn" aria-label="Previous"><i class="ti ti-chevron-left" aria-hidden="true"></i></button>
    <span id="periodLabel" style="font-family:'Cormorant Garamond',Georgia,serif;font-size:20px;color:var(--text-primary);"></span>
    <button id="nextBtn" aria-label="Next"><i class="ti ti-chevron-right" aria-hidden="true"></i></button>
  </div>
  <button id="modeBtn">Preview mobile week view</button>
</div>
<div id="legend" style="display:flex;gap:14px;flex-wrap:wrap;margin-bottom:10px;font-size:12px;color:var(--text-secondary);"></div>
<div id="calRoot"></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/0/placeholder.js" onerror=""></script>
<script>
const TYPES = {
  essay:{label:'Essay published',fg:'#173404',bg:'#EAF3DE'},
  reading:{label:'Reading date',fg:'#042C53',bg:'#E6F1FB'},
  historical:{label:'Historical event',fg:'#412402',bg:'#FAEEDA'},
  release:{label:'Upcoming release',fg:'#4B1528',bg:'#FBEAF0'}
};
const sample = [
  {d:'2026-07-03',type:'essay',title:'Bella Vita, Brutta Morte'},
  {d:'2026-07-08',type:'essay',title:'Rasp and Snarl'},
  {d:'2026-07-14',type:'reading',title:'Started The Poisonwood Bible'},
  {d:'2026-07-16',type:'reading',title:'Started Empire'},
  {d:'2026-07-01',type:'historical',title:'Duke of York\\'s renamed'},
  {d:'2026-07-22',type:'release',title:'NetGalley ARC due'},
  {d:'2026-07-28',type:'essay',title:'Stoppard essay'},
  {d:'2026-06-16',type:'historical',title:'Bloomsday, 1816'}
];
let view = new Date(2026,6,1);
let mode = 'month';
const legend = document.getElementById('legend');
legend.innerHTML = Object.values(TYPES).map(t=>
  '<span style="display:flex;align-items:center;gap:5px;"><span style="width:8px;height:8px;border-radius:50%;background:'+t.fg+';display:inline-block;"></span>'+t.label+'</span>'
).join('');

function eventsOn(dateStr){ return sample.filter(e=>e.d===dateStr); }
function fmt(y,m,day){ return y+'-'+String(m+1).padStart(2,'0')+'-'+String(day).padStart(2,'0'); }

function renderMonth(){
  const y = view.getFullYear(), m = view.getMonth();
  document.getElementById('periodLabel').textContent = view.toLocaleDateString('en-US',{month:'long',year:'numeric'});
  const first = new Date(y,m,1);
  const startOffset = first.getDay();
  const gridStart = new Date(y,m,1-startOffset);
  let html = '<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--border);border:1px solid var(--border);">';
  ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].forEach(d=>{
    html += '<div style="background:#2A0E38;color:#C4A055;font-size:10px;letter-spacing:.14em;text-transform:uppercase;padding:8px 6px;text-align:center;">'+d+'</div>';
  });
  for(let i=0;i<35;i++){
    const cellDate = new Date(gridStart); cellDate.setDate(gridStart.getDate()+i);
    const inMonth = cellDate.getMonth()===m;
    const ds = fmt(cellDate.getFullYear(),cellDate.getMonth(),cellDate.getDate());
    const evs = eventsOn(ds);
    html += '<div style="background:var(--surface-2);min-height:78px;padding:6px;opacity:'+(inMonth?1:0.4)+';">';
    html += '<div style="font-size:11px;color:var(--text-secondary);margin-bottom:4px;">'+cellDate.getDate()+'</div>';
    evs.forEach(e=>{
      const t = TYPES[e.type];
      html += '<div style="font-size:10px;background:'+t.bg+';color:'+t.fg+';padding:2px 5px;border-radius:4px;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">'+e.title+'</div>';
    });
    html += '</div>';
  }
  html += '</div>';
  document.getElementById('calRoot').innerHTML = html;
}

function renderWeek(){
  const y = view.getFullYear(), m = view.getMonth(), day = view.getDate();
  const start = new Date(view); start.setDate(day - view.getDay());
  const end = new Date(start); end.setDate(start.getDate()+6);
  document.getElementById('periodLabel').textContent = start.toLocaleDateString('en-US',{month:'short',day:'numeric'})+' - '+end.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
  let html = '<div style="max-width:340px;margin:0 auto;border:1px solid var(--border);">';
  for(let i=0;i<7;i++){
    const cellDate = new Date(start); cellDate.setDate(start.getDate()+i);
    const ds = fmt(cellDate.getFullYear(),cellDate.getMonth(),cellDate.getDate());
    const evs = eventsOn(ds);
    html += '<div style="border-bottom:1px solid var(--border);padding:10px 12px;">';
    html += '<div style="font-size:12px;color:var(--text-secondary);margin-bottom:4px;">'+cellDate.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'})+'</div>';
    if(evs.length===0){ html += '<div style="font-size:11px;color:var(--text-muted);">No entries</div>'; }
    evs.forEach(e=>{
      const t = TYPES[e.type];
      html += '<div style="font-size:12px;background:'+t.bg+';color:'+t.fg+';padding:4px 8px;border-radius:4px;margin-bottom:3px;">'+e.title+'</div>';
    });
    html += '</div>';
  }
  html += '</div>';
  document.getElementById('calRoot').innerHTML = html;
}

function render(){ mode==='month' ? renderMonth() : renderWeek(); }
document.getElementById('prevBtn').onclick = ()=>{
  if(mode==='month'){ view.setMonth(view.getMonth()-1); } else { view.setDate(view.getDate()-7); }
  render();
};
document.getElementById('nextBtn').onclick = ()=>{
  if(mode==='month'){ view.setMonth(view.getMonth()+1); } else { view.setDate(view.getDate()+7); }
  render();
};
document.getElementById('modeBtn').onclick = (e)=>{
  mode = mode==='month' ? 'week' : 'month';
  e.target.textContent = mode==='month' ? 'Preview mobile week view' : 'Back to desktop month view';
  render();
};
render();
</script>
