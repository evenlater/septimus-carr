baseURL = 'https://www.septimuscarr.com/'
title = 'Septimus Carr'
locale = 'en-us'
paginate = 12

[params]
  description  = 'Longform Literary Intersections'
  author       = 'Septimus Carr'
  tagline      = 'Longform Literary Intersections'
  substack     = 'https://septimuscarr.substack.com'
  goodreads    = 'https://www.goodreads.com/user/show/186362129-septimus-carr'
  medium       = 'https://medium.com/@septimuscarr'
  truelit      = ''
  murakami     = ''
  # Profile links below feed the Person schema on /about/ (sameAs). Leave blank to skip.
  reddit       = ''
  fable        = 'https://fable.co/fabler/birdboot-127099662514?tab=stats&period_type=year'
  # categoryOrder controls nav sequence; add new categories here too
  categoryOrder = ['Classics','Fiction','Drama','Essays','Nonfiction','Opera','Multi','Pulitzer','Booker','Notes']
  # Hyvor Talk website ID (from the Hyvor dashboard). Leave blank to hide comments.
  hyvorID = "16290"

[taxonomies]
  category = 'categories'
  author   = 'authors'

[outputs]
  home     = ['HTML','RSS','JSON']
  page     = ['HTML']
  section  = ['HTML','RSS']
  taxonomy = ['HTML']
  term     = ['HTML']

[markup.goldmark.renderer]
  unsafe = true
