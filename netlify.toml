[build]
  command = "node scripts/fetch-top-posts.mjs && hugo --gc --minify"
  publish = "public"

[build.environment]
  HUGO_VERSION  = "0.161.1"
  HUGO_EXTENDED = "true"
  # PLAUSIBLE_SITE_ID is just the public domain, which appears throughout the site.
  # Without this, Netlify secrets scanning flags every page and fails the build.
  # PLAUSIBLE_API_KEY is deliberately NOT listed, so it stays scanned.
  SECRETS_SCAN_OMIT_KEYS = "PLAUSIBLE_SITE_ID"
